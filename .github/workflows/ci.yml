name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Une nouvelle poussée annule la précédente sur la même branche : inutile de
# payer deux fois un job qui traverse une API externe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Next 16 exige >= 20.9 ; 22 est la LTS courante.
  NODE_VERSION: "22"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # `npm ci` échoue si le lockfile a divergé de package.json, là où
      # `npm install` le réécrivait silencieusement.
      - name: Install deps
        run: npm ci

      - name: Prettier check
        run: npx prettier . --check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (Next.js)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Job séparé : le smoke e2e traverse f1api.dev, une API publique externe.
    # Un hoquet de leur côté ne doit pas masquer le signal lint/types/build.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke e2e
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
